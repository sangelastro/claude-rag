<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="claude-rag: Local RAG over a folder of Markdown files, exposed to Claude Code">
<style>
.bg{fill:#ffffff}.t{fill:#0f172a}.s{fill:#475569}.m{fill:#64748b}
.lane1{fill:#f0fdfa;stroke:#99f6e4}.lane2{fill:#eff6ff;stroke:#bfdbfe}.lane3{fill:#fff7ed;stroke:#fed7aa}
.b{fill:#ffffff}.c1{stroke:#0f766e}.c2{stroke:#2563eb}.c3{stroke:#c2410c}
.k1{fill:#0f766e}.k2{fill:#2563eb}.k3{fill:#c2410c}
.a1{stroke:#0f766e}.a2{stroke:#2563eb}.a3{stroke:#c2410c}.dash{stroke:#94a3b8}
.h1{fill:#0f766e}.h2{fill:#2563eb}.h3{fill:#c2410c}.hd{fill:#94a3b8}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.t{fill:#e6edf3}.s{fill:#9da7b3}.m{fill:#7d8590}
.lane1{fill:#0b2420;stroke:#134e4a}.lane2{fill:#0c1a33;stroke:#1e3a8a}.lane3{fill:#2a1608;stroke:#7c2d12}
.b{fill:#161b22}.c1{stroke:#2dd4bf}.c2{stroke:#60a5fa}.c3{stroke:#fb923c}
.k1{fill:#2dd4bf}.k2{fill:#60a5fa}.k3{fill:#fb923c}
.a1{stroke:#2dd4bf}.a2{stroke:#60a5fa}.a3{stroke:#fb923c}.dash{stroke:#6e7681}
.h1{fill:#2dd4bf}.h2{fill:#60a5fa}.h3{fill:#fb923c}.hd{fill:#6e7681}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
</style>
<defs><marker id="mh1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h1" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mh2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h2" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mh3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h3" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mhd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hd" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1200" height="680" rx="16"/>
<text class="t" x="40" y="46" font-size="26" font-weight="800">claude-rag</text>
<text class="s" x="40" y="70" font-size="14">Local RAG over a folder of Markdown files, exposed to Claude Code</text>
<rect class="lane1" x="20" y="90" width="1160" height="170" rx="14" stroke-width="1.5"/>
<text class="k1" x="40" y="116" font-size="12.5" font-weight="700" letter-spacing="0.6">① INDEXING · at startup and on kb_reindex()</text>
<rect class="b c1" x="45" y="135" width="170" height="100" rx="10" stroke-width="2"/>
<text class="k1" x="130.0" y="168.0" text-anchor="middle" font-size="16" font-weight="700">Markdown files</text>
<text class="s" x="130.0" y="188.0" text-anchor="middle" font-size="12.5">your KB folder</text>
<text class="m" x="130.0" y="206.0" text-anchor="middle" font-size="12.5">*.md</text>
<rect class="b c1" x="255" y="135" width="190" height="100" rx="10" stroke-width="2"/>
<text class="k1" x="350.0" y="168.0" text-anchor="middle" font-size="16" font-weight="700">Chunker</text>
<text class="s" x="350.0" y="188.0" text-anchor="middle" font-size="12.5">split on ## sections</text>
<text class="m" x="350.0" y="206.0" text-anchor="middle" font-size="12.5">≤ 400 chars, 80 overlap</text>
<rect class="b c1" x="485" y="135" width="225" height="100" rx="10" stroke-width="2"/>
<text class="k1" x="597.5" y="168.0" text-anchor="middle" font-size="16" font-weight="700">Embedder</text>
<text class="s" x="597.5" y="188.0" text-anchor="middle" font-size="12.5">MiniLM · 384 dims (default)</text>
<text class="m" x="597.5" y="206.0" text-anchor="middle" font-size="12.5">or EmbeddingGemma 2 · 768</text>
<rect class="b c1" x="750" y="135" width="180" height="100" rx="10" stroke-width="2"/>
<text class="k1" x="840.0" y="168.0" text-anchor="middle" font-size="16" font-weight="700">kb.db</text>
<text class="s" x="840.0" y="188.0" text-anchor="middle" font-size="12.5">SQLite: text + vectors</text>
<text class="m" x="840.0" y="206.0" text-anchor="middle" font-size="12.5">+ search stats</text>
<rect class="b c1" x="990" y="135" width="165" height="100" rx="10" stroke-width="2"/>
<text class="k1" x="1072.5" y="168.0" text-anchor="middle" font-size="16" font-weight="700">kb_chunks.json</text>
<text class="s" x="1072.5" y="188.0" text-anchor="middle" font-size="12.5">plain text of every chunk</text>
<text class="m" x="1072.5" y="206.0" text-anchor="middle" font-size="12.5">for the hooks</text>
<path class="a1" d="M215,185.0 L253,185.0" fill="none" stroke-width="2" marker-end="url(#mh1)"/>
<path class="a1" d="M445,185.0 L483,185.0" fill="none" stroke-width="2" marker-end="url(#mh1)"/>
<path class="a1" d="M710,185.0 L748,185.0" fill="none" stroke-width="2" marker-end="url(#mh1)"/>
<path class="a1" d="M930,185.0 L988,185.0" fill="none" stroke-width="2" marker-end="url(#mh1)"/>
<text class="m" x="959" y="177.0" text-anchor="middle" font-size="11.5" font-style="italic">export</text>
<rect class="lane2" x="20" y="285" width="1160" height="200" rx="14" stroke-width="1.5"/>
<text class="k2" x="40" y="311" font-size="12.5" font-weight="700" letter-spacing="0.6">② SEARCH · Claude calls the kb_search() tool</text>
<rect class="b c2" x="45" y="360" width="150" height="70" rx="10" stroke-width="2"/>
<text class="k2" x="120.0" y="387.0" text-anchor="middle" font-size="16" font-weight="700">Query</text>
<text class="s" x="120.0" y="407.0" text-anchor="middle" font-size="12.5">from Claude</text>
<rect class="b c2" x="250" y="330" width="185" height="60" rx="10" stroke-width="2"/>
<text class="k2" x="342.5" y="352.0" text-anchor="middle" font-size="16" font-weight="700">BM25</text>
<text class="s" x="342.5" y="372.0" text-anchor="middle" font-size="12.5">exact words · top 50</text>
<rect class="b c2" x="250" y="405" width="185" height="60" rx="10" stroke-width="2"/>
<text class="k2" x="342.5" y="427.0" text-anchor="middle" font-size="16" font-weight="700">Semantic</text>
<text class="s" x="342.5" y="447.0" text-anchor="middle" font-size="12.5">cosine · top 50</text>
<rect class="b c2" x="490" y="360" width="130" height="70" rx="10" stroke-width="2"/>
<text class="k2" x="555.0" y="387.0" text-anchor="middle" font-size="16" font-weight="700">Fusion</text>
<text class="s" x="555.0" y="407.0" text-anchor="middle" font-size="12.5">RRF</text>
<rect class="b c2" x="675" y="350" width="210" height="90" rx="10" stroke-width="2"/>
<text class="k2" x="780.0" y="378.0" text-anchor="middle" font-size="16" font-weight="700">Reranker</text>
<text class="s" x="780.0" y="398.0" text-anchor="middle" font-size="12.5">cross-encoder · top 10</text>
<text class="m" x="780.0" y="416.0" text-anchor="middle" font-size="12.5">local, ~0.4 s</text>
<rect class="b c2" x="940" y="350" width="215" height="90" rx="10" stroke-width="2"/>
<text class="k2" x="1047.5" y="378.0" text-anchor="middle" font-size="16" font-weight="700">Top-K chunks</text>
<text class="s" x="1047.5" y="398.0" text-anchor="middle" font-size="12.5">file › section</text>
<text class="m" x="1047.5" y="416.0" text-anchor="middle" font-size="12.5">+ calibrated confidence</text>
<path class="a2" d="M195,385 C220,385 225,360 248,360" fill="none" stroke-width="2" marker-end="url(#mh2)"/>
<path class="a2" d="M195,405 C220,405 225,435 248,435" fill="none" stroke-width="2" marker-end="url(#mh2)"/>
<path class="a2" d="M435,360 C460,360 465,385 488,385" fill="none" stroke-width="2" marker-end="url(#mh2)"/>
<path class="a2" d="M435,435 C460,435 465,405 488,405" fill="none" stroke-width="2" marker-end="url(#mh2)"/>
<path class="a2" d="M620,395 L673,395" fill="none" stroke-width="2" marker-end="url(#mh2)"/>
<path class="a2" d="M885,395 L938,395" fill="none" stroke-width="2" marker-end="url(#mh2)"/>
<path class="dash" d="M840,235 L840,270 L420,270 L420,328" fill="none" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#mhd)"/>
<text class="m" x="630" y="264" text-anchor="middle" font-size="11.5" font-style="italic">text + vectors</text>
<rect class="lane3" x="20" y="510" width="1160" height="150" rx="14" stroke-width="1.5"/>
<text class="k3" x="40" y="536" font-size="12.5" font-weight="700" letter-spacing="0.6">③ HOOKS · automatic, on every session and prompt</text>
<rect class="b c3" x="45" y="555" width="220" height="85" rx="10" stroke-width="2"/>
<text class="k3" x="155.0" y="580.5" text-anchor="middle" font-size="16" font-weight="700">SessionStart</text>
<text class="s" x="155.0" y="600.5" text-anchor="middle" font-size="12.5">injects the KB table</text>
<text class="m" x="155.0" y="618.5" text-anchor="middle" font-size="12.5">of contents</text>
<rect class="b c3" x="400" y="562" width="180" height="70" rx="10" stroke-width="2"/>
<text class="k3" x="490.0" y="589.0" text-anchor="middle" font-size="16" font-weight="700">Your prompt</text>
<text class="s" x="490.0" y="609.0" text-anchor="middle" font-size="12.5">UserPromptSubmit</text>
<rect class="b c3" x="640" y="555" width="230" height="85" rx="10" stroke-width="2"/>
<text class="k3" x="755.0" y="580.5" text-anchor="middle" font-size="16" font-weight="700">kb_recall.py</text>
<text class="s" x="755.0" y="600.5" text-anchor="middle" font-size="12.5">keyword match · ~10 ms</text>
<text class="m" x="755.0" y="618.5" text-anchor="middle" font-size="12.5">no model</text>
<rect class="b c3" x="935" y="555" width="220" height="85" rx="10" stroke-width="2"/>
<text class="k3" x="1045.0" y="580.5" text-anchor="middle" font-size="16" font-weight="700">Claude</text>
<text class="s" x="1045.0" y="600.5" text-anchor="middle" font-size="12.5">prompt + matching</text>
<text class="m" x="1045.0" y="618.5" text-anchor="middle" font-size="12.5">chunks</text>
<path class="a3" d="M580,597 L638,597" fill="none" stroke-width="2" marker-end="url(#mh3)"/>
<path class="a3" d="M870,597 L933,597" fill="none" stroke-width="2" marker-end="url(#mh3)"/>
<path class="dash" d="M1155,185 L1170,185 L1170,545 L755,545 L755,553" fill="none" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#mhd)"/>
<text class="m" x="1010" y="539" text-anchor="middle" font-size="11.5" font-style="italic">text only</text>
</svg>