<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #090E1A;
    color: #C8D6E8;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .page-title {
    font-family: ui-monospace, 'Cascadia Code', 'Consolas', monospace;

    font-weight: 700;

    letter-spacing: .04em;
    margin-bottom: 8px;
    text-align: center;
  }
  .page-sub {
    font-size: 13px;
    color: #4A6080;
    margin-bottom: 28px;
    text-align: center;
    font-family: ui-monospace, monospace;
  }

  .diagram-wrap {
    width: 100%;
    max-width: 900px;
  }

  svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    margin-top: 22px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #7A92B0;
    font-family: ui-monospace, monospace;
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  @media (prefers-color-scheme: light) {
    body { background: #F0F4FA; color: #1A2A3A; }

    .page-sub { color: #7A92B0; }
    .legend-item { color: #4A5A6A; }

  :root[data-theme="light"] {
